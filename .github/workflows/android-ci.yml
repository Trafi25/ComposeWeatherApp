name: Android CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed for dependency graph

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          dependency-graph: generate-and-submit

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      -   name: Create google-services.json
          env:
              GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          run: |
              mkdir -p app/
              if [ -z "$GOOGLE_SERVICES_JSON" ]; then
                echo "Secret GOOGLE_SERVICES_JSON is missing. Using dummy file to allow build to continue."
                echo '{"project_info":{"project_id":"dummy-project","project_number":"0","firebase_url":"https://dummy.firebaseio.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.plcoding.weatherapp"}},"api_key":[{"current_key":"dummy"}],"services":{"analytics_service":{"status":1}}}],"configuration_version":"1"}' > app/google-services.json
              else
                printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
              fi

      -   name: Verify Firebase config
          run: |
              echo "Firebase project:"
              jq -r '.project_info.project_id' app/google-services.json || echo "Failed to parse project_id"

              echo "Firebase package:"
              jq -r '.client[].client_info.android_client_info.package_name' app/google-services.json || echo "Failed to parse package_name"

      - name: Check Formatting
        run: ./gradlew spotlessCheck

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Run Lint
        run: ./gradlew lintDebug

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # Upload the APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # Upload Test Reports if tests fail
      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      # Upload Lint Reports if lint fails
      - name: Upload Lint Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.html
